spring:
  config:
    import: optional:file:./.env[.properties]

  application:
    name: multi-drive-api

  datasource:
    url: ${DB_URL}
    username: ${DB_USERNAME}
    password: ${DB_PASSWORD}

  jpa:
    hibernate:
      ddl-auto: none
    show-sql: true

  security:
    oauth2:
      client:
        registration:
          google:
            client-id: ${GOOGLE_CLIENT_ID}
            client-secret: ${GOOGLE_CLIENT_SECRET}
            scope:
              - openid
              - email
              - profile

google:
  oauth2:
    drive-redirect-uri: ${GOOGLE_DRIVE_REDIRECT_URI}

  drive:
    webhook-url: ${GOOGLE_DRIVE_WEBHOOK_URL:}

app:
  security:
    token-encryption-key: ${TOKEN_ENCRYPTION_KEY}