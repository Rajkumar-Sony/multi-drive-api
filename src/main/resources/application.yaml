spring:
  application:
    name: multi-drive-api

  datasource:
    url: jdbc:postgresql://localhost:5432/multi_drive_db
    username: multi_drive_user
    password: "admin123"

  jpa:
    hibernate:
      ddl-auto: none
    show-sql: true

  security:
    oauth2:
      client:
        registration:
          google:
            client-id: ${GOOGLE_CLIENT_ID}
            client-secret: ${GOOGLE_CLIENT_SECRET}
            scope:
              - openid
              - email
              - profile